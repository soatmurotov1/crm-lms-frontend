<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="O'quv markazi boshqaruv tizimi" />
    <!--
      Rejim foni ilova yuklanguncha ham to'g'ri bo'lishi uchun: aks holda
      tungi rejimda bir lahzaga oq ekran chaqnaydi.
    -->
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>EduCenter</title>

    <script>
      /*
        Rejimni React yuklanguncha qo'yamiz. ThemeProvider buni effekt ichida
        qiladi, ya'ni birinchi bo'yashda <html> da hali belgi yo'q va tungi
        rejim tanlagan foydalanuvchiga bir lahza oq ekran chaqnaydi.
        Kalitlar ThemeProvider'dagilar bilan bir xil bo'lishi shart.
      */
      (function () {
        try {
          var raw = localStorage.getItem("crm_theme_v1");
          var dark;
          if (raw !== null) {
            dark = raw === "dark";
          } else {
            var legacy = localStorage.getItem("crm_admin_dashboard_cache_v1");
            dark = legacy ? Boolean(JSON.parse(legacy).darkMode) : false;
          }
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
