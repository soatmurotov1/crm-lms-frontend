# Har bir `location` ichida `include` qilinadi: nginx'da location darajasidagi
# `add_header` server darajasidagilarni bekor qiladi, shuning uchun ular bitta
# faylda saqlanadi.
#
# CSP: faqat o'z domenimizdagi skriptlar ishlaydi — XSS orqali kiritilgan
# inline skript yoki begona mayner skripti (kriptojeking) bloklanadi.
# connect-src: API boshqa domenda bo'lishi mumkin (VITE_API_BASE_URL), lekin
# faqat HTTPS; wss:// mayner pullariga ulanish ruxsat etilmaydi.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' blob: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
