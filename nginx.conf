server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Versiyani oshkor qilmaymiz (nol-kun hujumlarida nishon tanlashni qiyinlashtiradi).
    server_tokens off;

    # DoS: katta yoki sekin so'rovlar bilan serverni band qilishni cheklash.
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        return 200;
    }

    # Hashed Vite build output (assets/*-<hash>.js, assets/*-<hash>.css) — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Service worker must always be revalidated or PWA updates never reach clients.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html must always be revalidated so new deploys (and their asset hashes) are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # The app shell is never meant for search results. Keep this header in
        # line with the robots meta in index.html and the vercel.json header.
        add_header X-Robots-Tag "noindex, nofollow";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback for TanStack Router client-side routes.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
